[workspace]
resolver = "2"
members = [
    # 核心层：契约/负载均衡/插件框架/协议适配/持久化/流量治理/控制面/网关/官方插件
    "conrogate-core",
    # 工具
    "conrogate-migrate",   # 迁移工具 CLI
    # 二进制
    "conrogate-gate",      # 数据面二进制（分离模式）
    "conrogate-control",   # 控制面二进制（分离模式）
    "conrogate",           # 合并模式二进制（数据面 + 控制面）
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/conrogate/conrogate"
authors = ["Conrogate Team"]

[workspace.dependencies]
# ── 异步运行时 ──
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# ── 错误处理 ──
thiserror = "1.0"
anyhow = "1.0"

# ── 命令行 ──
clap = { version = "4.5", features = ["derive"] }

# ── 序列化 ──
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# ── HTTP 核心（协议栈 + TLS + 桥接）──
http = "1.1"
http-body-util = "0.1"
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "native-tokio", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = { version = "2" }

# ── 控制面框架（axum + OpenAPI）──
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
utoipa = { version = "5.0", features = ["chrono"] }
utoipa-axum = "0.1"

# ── 数据库（postgres / mysql / sqlite 三方言；连接 URL 前缀决定使用哪个驱动）──
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "sqlx-mysql",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-json",
    "with-chrono",
] }
sea-orm-migration = { version = "1.1", features = [
    "sqlx-postgres",
    "sqlx-mysql",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }

# ── 日志链路 ──
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = { version = "0.2" }

# ── 密码学 ──
sha2 = { version = "0.10" }
hex = { version = "0.4" }
jsonwebtoken = "9.3"

# ── 基础工具 ──
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
rand = "0.8"
ipnet = { version = "2.10", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1.7"

# ── 配置加载 ──
dotenvy = "0.15"

# ── 集群共享状态 ──
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# ── 正则匹配 ──
regex = "1.10"

# ── 内部 crate ──
conrogate-core = { path = "conrogate-core" }

[profile.release]
lto = "thin"
codegen-units = 1

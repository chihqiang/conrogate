# ══════════════════════════════════════════════════════════════════════
# Conrogate 本地开发/测试依赖：PostgreSQL 16 + Redis 7
#
# 仅提供基础存储依赖，不包含网关本体（由 scripts/dev-up.sh 或
# deploy/docker-compose.prod.yml / separated.prod.yml 启动）。
#
# 用法：
#   docker compose -f deploy/docker-compose.deps.yml up -d        # 启动依赖
#   docker compose -f deploy/docker-compose.deps.yml down         # 停止并保留数据卷
#   docker compose -f deploy/docker-compose.deps.yml down -v      # 停止并清空数据
#
# 连接信息（本地开发，凭据仅用于非生产）：
#   PostgreSQL  127.0.0.1:5432  conrogate / conrogate_dev / conrogate
#   Redis       127.0.0.1:6379  （无密码）
# ══════════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL 16（网关主库：路由/上游/插件/配置版本等）──
  postgres:
    image: postgres:16
    container_name: conrogate-pg
    environment:
      POSTGRES_USER: conrogate
      POSTGRES_PASSWORD: conrogate_dev
      POSTGRES_DB: conrogate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "conrogate"]
      interval: 2s
      timeout: 2s
      retries: 20

  # ── Redis 7（配置快照/Pub-Sub 推送、集群限流、熔断计数）──
  redis:
    image: redis:7-alpine
    container_name: conrogate-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pgdata:
  redisdata:
